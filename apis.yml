aid: cardiosense
name: Cardiosense
description: >-
  Cardiosense, Inc. is a Chicago-based medical technology company developing
  AI-powered, noninvasive cardiac hemodynamic monitoring for heart failure care.
  Its CardioTag device is a wearable chest biosensor that captures
  seismocardiographic (SCG), electrocardiographic (ECG) and photoplethysmographic
  (PPG) signals, and its PCWP Analysis Software is a standalone AI
  software-as-a-medical-device that estimates Pulmonary Capillary Wedge Pressure
  from those signals without right heart catheterization or an implantable
  sensor. Both are authorized by the FDA as Class II medical devices, and the
  company received an FDA De Novo classification. Cardiosense publishes no
  developer program, SDK or API specification; its only machine-readable
  surfaces are an authored llms.txt, an extended AI-context document, an
  explicit AI-crawler allowance in robots.txt, and an OAuth-protected Model
  Context Protocol server on its own host.
