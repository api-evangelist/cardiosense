  detail: >-
    Cardiosense runs no developer program and publishes no API contract, but the
    profile is not empty: contract discovery turned up a hand-authored llms.txt,
    an llms-full.txt, an explicit AI-crawler allowance in robots.txt, and a live
    OAuth-protected Model Context Protocol server at
    /wp-json/mcp/mcp-oauth-server whose RFC 8414 and RFC 9728 discovery
    documents are served anonymously. The MCP tool list is the one thing still
    out of reach — tools/list and the backing WordPress Abilities registry both
    answer HTTP 401, so per-tool input schemas would need an mcp-scoped token.
    No OpenAPI, Swagger, GraphQL SDL, AsyncAPI, Postman collection or A2A agent
    card exists on any Cardiosense host.
